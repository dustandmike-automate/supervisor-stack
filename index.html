<style>
:root{--rock:#0C1F33;--dust:#08090B;--silicon:#9AA7B6;--crystal:#F3F8FC;--mist:#8095AA;--hair:rgba(154,167,182,.36);--fault:#FF8F8F;color-scheme:dark}
html,body{margin:0;height:100%;background:radial-gradient(90% 60% at 50% 35%,#13304E,transparent 75%),var(--rock);color:var(--crystal);font:15px/1.5 -apple-system,system-ui,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-sizing:border-box}
form{width:min(340px,100%);display:grid;gap:12px;background:var(--dust);border:1px solid var(--hair);padding:22px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}

h1{margin:0;text-align:center;font:700 24px/1.1 system-ui,sans-serif;letter-spacing:-.01em}
p{margin:0;text-align:center;color:var(--mist);font-size:12px}
label{font:500 10px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
input[type=password]{font:16px ui-monospace,Menlo,monospace;color:var(--crystal);background:#0E1218;border:1px solid var(--hair);padding:11px 12px;border-radius:0;outline:none}
input[type=password]:focus{border-color:var(--crystal)}
.row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--silicon)}
button{font:600 15px system-ui,sans-serif;color:var(--dust);background:var(--crystal);border:0;padding:12px;cursor:pointer}
button:disabled{opacity:.5}
#msg{min-height:18px;font:12px ui-monospace,Menlo,monospace;color:var(--fault);text-align:center}

<script>
(()=>{let B=JSON.parse(document.getElementById("blob").textContent),u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),S=crypto.subtle;
const DB="stack-lock",ST="k";
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kget=async()=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction(ST).objectStore(ST).get("key");q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch{return null}};
const kput=async k=>{try{const d=await idb();d.transaction(ST,"readwrite").objectStore(ST).put(k,"key")}catch{}};
const kdel=async()=>{try{const d=await idb();d.transaction(ST,"readwrite").objectStore(ST).delete("key")}catch{}};
const open=async k=>{const pt=await S.decrypt({name:"AES-GCM",iv:u(B.iv)},k,u(B.ct));return new TextDecoder().decode(pt)};
const show=html=>{document.open();document.write(html);document.close()};
document.getElementById("stamp").textContent=B.t?"Build "+B.t:"";
const fresh=async()=>{try{const h=await (await fetch("./index.html?fresh="+Date.now(),{cache:"no-store"})).text();const el=new DOMParser().parseFromString(h,"text/html").getElementById("blob");if(!el)return false;const N=JSON.parse(el.textContent);if(N.iv===B.iv)return false;B=N;document.getElementById("stamp").textContent="Build "+(B.t||"");return true}catch{return false}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
(async()=>{await fresh();const k=await kget();if(k){try{show(await open(k));return}catch{await kdel()}}
 document.getElementById("lock").hidden=false;document.getElementById("pw").focus()})();
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const go=document.getElementById("go"),msg=document.getElementById("msg");go.disabled=true;msg.textContent="Unlocking…";
 try{const base=await S.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
  let k=await S.deriveKey({name:"PBKDF2",salt:u(B.salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let html;try{html=await open(k)}catch(err){if(!(await fresh()))throw err;
   const k2=await S.deriveKey({name:"PBKDF2",salt:u(B.salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);html=await open(k2);k=k2}
  if(document.getElementById("rem").checked)await kput(k);show(html)}
 catch{msg.textContent="Wrong passcode. Try again.";go.disabled=false}});
})();
</script></body></html>
